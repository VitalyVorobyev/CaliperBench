[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caliperbench"
version = "0.1.0"
description = "Real-image benchmark tooling for edge and dimensional measurement"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "pydantic>=2.8,<3",
    "scikit-image>=0.24,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
caliperbench = "caliperbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
